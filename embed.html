<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Widget wykresu rowerowego</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #212529;
    }

    .widget-wrap {
      padding: 12px 12px 8px;
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .widget-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      margin: 0;
    }

    .widget-subtitle {
      font-size: 12px;
      color: #6c757d;
      margin-top: 2px;
    }

    .chart-box {
      position: relative;
      height: 340px;
    }

    .widget-footer {
      margin-top: 10px;
      font-size: 11px;
      color: #6c757d;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status {
      font-size: 13px;
      color: #6c757d;
      padding: 8px 0;
    }

    .error {
      color: #842029;
    }
  </style>
</head>
<body>
  <div class="widget-wrap">
    <div class="widget-header">
      <div>
        <h1 class="widget-title" id="widgetTitle">Ładowanie wykresu…</h1>
        <div class="widget-subtitle" id="widgetSubtitle"></div>
      </div>
    </div>

    <div id="statusBox" class="status">Ładowanie danych…</div>

    <div class="chart-box">
      <canvas id="widgetChart"></canvas>
    </div>

    <div class="widget-footer">
      <div id="widgetSource">Źródło: rowerowy.otwartyplan.org</div>
      <div id="widgetMeta"></div>
    </div>
  </div>

  <script>
    const META_URL = "./cache/permanent/meta_periods.json";
    const DETAILS_URL = (mode, period) => `./cache/permanent/details_${mode}_${period}.json`;
    const WEATHER_URL = "./data/weather_daily.json";

    let widgetChart = null;
    let weatherDailyCache = null;

    function getUrlState() {
      const url = new URL(window.location.href);

      return {
        licznik: url.searchParams.get("licznik"),
        okres: url.searchParams.get("okres") || "month",
        wartosc: url.searchParams.get("wartosc"),
        wykres: url.searchParams.get("wykres") || "daily"
      };
    }

    function prettyLabel(mode, period) {
      if (!period) return "";

      if (mode === "month") {
        const y = period.slice(0, 4);
        const m = period.slice(5, 7);
        const names = ["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
        return `${names[parseInt(m, 10) - 1]} ${y}`;
      }

      if (mode === "quarter") {
        const y = period.slice(0, 4);
        const q = period.slice(6);
        return `${q}. kwartał ${y}`;
      }

      if (mode === "year") {
        return `Rok ${period}`;
      }

      return period;
    }

    async function getWeatherDailyCached() {
      if (weatherDailyCache) return weatherDailyCache;

      try {
        const res = await fetch(WEATHER_URL, { cache: "no-store" });
        weatherDailyCache = await res.json();
        return weatherDailyCache || {};
      } catch (e) {
        weatherDailyCache = {};
        return {};
      }
    }

    function setStatus(text, isError = false) {
      const box = document.getElementById("statusBox");
      if (!box) return;
      box.textContent = text;
      box.classList.toggle("error", !!isError);
    }

    function setHeader(title, subtitle = "", meta = "") {
      document.getElementById("widgetTitle").textContent = title;
      document.getElementById("widgetSubtitle").textContent = subtitle;
      document.getElementById("widgetMeta").textContent = meta;
    }

    function destroyChart() {
      if (widgetChart) {
        widgetChart.destroy();
        widgetChart = null;
      }
    }

    function renderDailyWidget(counter, weatherDaily, counterId, mode, period) {
      const daily = counter?.daily || [];

      const enriched = daily.map(x => {
        const w = weatherDaily?.[x.date] || {};
        return {
          ...x,
          temp_avg: w.temp_avg,
          temp_min: w.temp_min,
          temp_max: w.temp_max,
          precip_sum: w.precip_sum
        };
      });

      const labels = enriched.map(x => x.date);
      const values = enriched.map(x => x.count);
      const tempAvg = enriched.map(x => x.temp_avg ?? null);
      const precipSum = enriched.map(x => x.precip_sum ?? null);

      destroyChart();

      widgetChart = new Chart(document.getElementById("widgetChart"), {
        type: "bar",
        data: {
          labels,
          datasets: [
            {
              type: "bar",
              label: "Suma dzienna",
              data: values,
              yAxisID: "y",
              backgroundColor: "rgba(13,110,253,0.7)",
              borderColor: "#0d6efd",
              borderWidth: 1,
              borderRadius: 3,
              order: 3
            },
            {
              type: "line",
              label: "Śr. temp. [°C]",
              data: tempAvg,
              yAxisID: "yWeather",
              borderColor: "#dc3545",
              backgroundColor: "rgba(220,53,69,0.10)",
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 4,
              tension: 0.25,
              order: 1
            },
            {
              type: "bar",
              label: "Opad [mm]",
              data: precipSum,
              yAxisID: "yWeather",
              backgroundColor: "rgba(25,135,84,0.20)",
              borderColor: "rgba(25,135,84,0.55)",
              borderWidth: 1,
              borderRadius: 1,
              barThickness: 4,
              maxBarThickness: 4,
              categoryPercentage: 1.0,
              barPercentage: 0.18,
              hidden: true,
              order: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: {
              position: "bottom"
            },
            tooltip: {
              callbacks: {
                title(items) {
                  const rawDate = items?.[0]?.label;
                  if (!rawDate) return "";

                  const [y, m, d] = rawDate.split("-").map(Number);
                  const dt = new Date(y, m - 1, d);

                  return new Intl.DateTimeFormat("pl-PL", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                  }).format(dt);
                },
                label(ctx) {
                  const label = ctx.dataset.label || "";
                  const value = ctx.raw;

                  if (value === null || value === undefined) return `${label}: brak danych`;
                  if (label.includes("temp")) return `${label}: ${value}°C`;
                  if (label.includes("Opad")) return `${label}: ${value} mm`;
                  return `${label}: ${Number(value).toLocaleString("pl-PL")}`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                autoSkip: true,
                maxTicksLimit: 12
              }
            },
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: "Liczba rowerów"
              }
            },
            yWeather: {
              position: "right",
              grid: {
                drawOnChartArea: false
              },
              title: {
                display: true,
                text: "Pogoda"
              }
            }
          }
        }
      });

      setHeader(
        "Suma dzienna",
        `${counterId} · ${prettyLabel(mode, period)}`,
        "Widget interaktywny"
      );
    }

    function renderHourlyWidget(counter, key, title, counterId, mode, period) {
      const arr = counter?.[key] || [];

      const labels = arr.map(x => x.hour);
      const avg = arr.map(x => x.avg);
      const med = arr.map(x => x.median);
      const min = arr.map(x => x.min ?? 0);
      const max = arr.map(x => x.max ?? 0);

      const lineColor = key === "hourly_weekend" ? "#dc3545" : "#198754";
      const fillColor = key === "hourly_weekend" ? "rgba(220,53,69,0.12)" : "rgba(25,135,84,0.12)";

      destroyChart();

      widgetChart = new Chart(document.getElementById("widgetChart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "Min",
              data: min,
              borderColor: "rgba(0,0,0,0)",
              backgroundColor: "rgba(0,0,0,0)",
              pointRadius: 0,
              fill: false
            },
            {
              label: "min–max",
              data: max,
              borderColor: "rgba(0,0,0,0)",
              backgroundColor: fillColor,
              pointRadius: 0,
              fill: "-1"
            },
            {
              label: title,
              data: avg,
              borderColor: lineColor,
              backgroundColor: fillColor,
              tension: 0.25,
              fill: false,
              pointRadius: 0,
              pointHoverRadius: 6,
              hitRadius: 12
            },
            {
              label: "typowy ruch",
              data: med,
              borderColor: "rgba(102,16,242,0.75)",
              backgroundColor: "rgba(102,16,242,0.10)",
              tension: 0.25,
              fill: false,
              pointRadius: 0,
              pointHoverRadius: 6,
              hitRadius: 12
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: {
              position: "bottom",
              labels: {
                filter: (item) => item.text !== "Min"
              }
            },
            tooltip: {
              filter: (ctx) => ctx.dataset.label !== "Min"
            }
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });

      setHeader(
        title === "weekend" ? "Profil dobowy – weekend" : "Profil dobowy – dni powszednie",
        `${counterId} · ${prettyLabel(mode, period)}`,
        "Widget interaktywny"
      );
    }

    async function initWidget() {
      try {
        const state = getUrlState();

        if (!state.licznik || !state.okres || !state.wartosc || !state.wykres) {
          setStatus("Brak wymaganych parametrów widgetu.", true);
          return;
        }

        const detailsRes = await fetch(DETAILS_URL(state.okres, state.wartosc), { cache: "no-store" });
        const detailsData = await detailsRes.json();

        const counter = detailsData?.counters?.[state.licznik];
        if (!counter) {
          setStatus("Nie znaleziono danych dla wskazanego licznika.", true);
          return;
        }

        setStatus("");

        if (state.wykres === "daily") {
          const weatherDaily = await getWeatherDailyCached();
          renderDailyWidget(counter, weatherDaily, state.licznik, state.okres, state.wartosc);
          return;
        }

        if (state.wykres === "weekday") {
          renderHourlyWidget(counter, "hourly_weekday", "dni powszednie", state.licznik, state.okres, state.wartosc);
          return;
        }

        if (state.wykres === "weekend") {
          renderHourlyWidget(counter, "hourly_weekend", "weekend", state.licznik, state.okres, state.wartosc);
          return;
        }

        setStatus("Nieznany typ wykresu.", true);
      } catch (e) {
        console.error(e);
        setStatus("Nie udało się wczytać widgetu.", true);
      }
    }

    initWidget();
  </script>
</body>
</html>
